name: esjednice
description: eSjednice - Digital meetings and voting management for educational institutions.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0

  # State Management
  flutter_riverpod: ^2.4.1
  riverpod_annotation: ^2.3.1

  # UI
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # Utils
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
